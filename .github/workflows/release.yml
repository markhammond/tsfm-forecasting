name: release

# Publishing is deliberately manual and tag-driven. These packages redistribute
# third-party weights, and a push to nuget.org cannot be undone — only delisted — so it
# should never be a side effect of merging.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and validate without pushing'
        type: boolean
        default: true

jobs:
  publish:
    # Packing embeds resources; nothing here needs Metal. The Metal path is covered by
    # the ci workflow's matrix.
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Fetch checkpoints
        run: |
          ./scripts/fetch-checkpoints.sh
          ./scripts/fetch-timestral-checkpoint.sh

      - name: Verify the tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared=$(grep -o '<Version>[^<]*' Directory.Build.props | cut -d'>' -f2)
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $tagged does not match <Version>$declared in Directory.Build.props"
            exit 1
          fi

      - name: Build and test
        run: |
          dotnet build -c Release --nologo
          dotnet test tests/Tsfm.Forecasting.Kronos.Tests -c Release --nologo --no-build

      - name: Pack
        run: dotnet pack -c Release --nologo --no-build -o artifacts

      - name: Inspect what would be published
        run: ./scripts/verify-packages.sh artifacts

      # Kept for the manual route: tag, let this build and verify, then download and
      # upload through nuget.org rather than trusting a local working tree.
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.ref_name }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Push to nuget.org
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          # No key means publishing is being done by hand; the packages are attached
          # above. Skip rather than fail, so tagging stays safe either way.
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::NUGET_API_KEY unset — skipping the push; upload the attached packages manually."
            exit 0
          fi
          dotnet nuget push 'artifacts/*.nupkg' \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
